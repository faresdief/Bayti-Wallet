<style>
:root {
  --background: 45 30% 96%;
  --foreground: 220 20% 15%;
  --card: 0 0% 100%;
  --primary: 262 83% 58%;
  --primary-foreground: 0 0% 100%;
  --secondary: 45 100% 65%;

  --muted-foreground: 220 10% 45%;
  --accent: 174 62% 47%;

  --category-transport: 280 70% 55%;
  --category-entertainment: 340 80% 55%;
  --category-shopping: 150 60% 45%;

}
html.dark {
  color-scheme: dark;
  --background: 230 25% 10%;
  --foreground: 45 20% 95%;
  --card: 230 20% 14%;
  --primary: 262 83% 65%;
  --secondary: 45 80% 55%;
  --muted: 230 15% 20%;
  --muted-foreground: 220 10% 60%;
  --accent: 174 62% 50%;
  --destructive: 0 70% 50%;
  --border: 230 15% 22%;
  --category-food: 25 90% 60%;
  --category-bills: 200 80% 55%;
  --category-transport: 280 65% 60%;
  --category-entertainment: 340 75% 60%;
  --category-shopping: 150 55% 50%;
  --category-health: 0 70% 60%;
  --category-education: 220 70% 60%;
  --category-other: 45 10% 60%;
}
html.fx { --glass: .72; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: 'Cairo', 'Tajawal', 'Noto Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
svg.i { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
html[dir="rtl"] .mirror svg, html[dir="rtl"] svg.mirror { transform: scaleX(-1); }

/* soft colour wash behind everything (only when effects are on) */
html.fx body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 45% at 100% 0%, hsl(var(--primary) / .20), transparent 70%),
    radial-gradient(60% 40% at 0% 38%, hsl(var(--accent) / .15), transparent 70%),
    radial-gradient(70% 45% at 100% 100%, hsl(var(--primary) / .12), transparent 70%);
}

/* ---------- layout ---------- */
.page { min-height: 100vh; padding-bottom: 6rem; }
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: hsl(var(--background) / .95);
  border-bottom: 1px solid hsl(var(--border) / 0.5);
}
html.fx .app-header { background: hsl(var(--background) / .62); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
.container { max-width: 32rem; margin: 0 auto; padding: 0 1rem; }
.app-header h1 { margin: 0; padding: 1rem 0; font-size: 1.5rem; font-weight: 700; }
main.container { padding-top: 1.25rem; padding-bottom: 1.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
main.tight { gap: 1rem; }
h2.section-title { margin: 0; font-size: 1.125rem; font-weight: 600; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
.link-btn { font-size: .875rem; font-weight: 600; color: hsl(var(--primary)); display: inline-flex; align-items: center; gap: .15rem; padding: .25rem .5rem; margin: -.25rem -.5rem; border-radius: .5rem; }
.link-btn svg { width: 1rem; height: 1rem; }

/* ---------- cards ---------- */
.card {
  background: hsl(var(--card) / var(--glass));
  border: 1px solid hsl(var(--border) / 0.5);
  border-radius: var(--radius);
  box-shadow: 0 1px 2px rgb(0 0 0 / .05);
  padding: 1.25rem;
}
html.fx .card { -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 1px 2px rgb(0 0 0 / .05), inset 0 1px 0 rgb(255 255 255 / .22); }
html.dark.fx .card { box-shadow: 0 1px 2px rgb(0 0 0 / .2), inset 0 1px 0 rgb(255 255 255 / .06); }
.card-title { margin: 0 0 .75rem; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
.card-title svg { color: hsl(var(--primary)); width: 1.25rem; height: 1.25rem; }
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary) / .8));
  color: hsl(var(--primary-foreground));
  border: 0; box-shadow: 0 10px 15px -3px rgb(0 0 0 / .15);
}
html.fx .hero { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: 0 12px 24px -8px hsl(var(--primary) / .55); }
.hero::after { content: ''; position: absolute; inset-block-start: -45%; inset-inline-end: -18%; width: 60%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgb(255 255 255 / .22), transparent 65%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero .row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
.hero .lbl { margin: 0; font-size: .875rem; font-weight: 500; opacity: .8; }
.hero .big { margin: .25rem 0 0; font-size: 1.875rem; font-weight: 700; }
.hero .big small { font-size: 1.125rem; font-weight: 600; }
.hero .mid { margin: .25rem 0 0; font-size: 1.25rem; font-weight: 600; }
.hero .end { text-align: end; }
.progress-head { display: flex; justify-content: space-between; font-size: .875rem; margin-bottom: .5rem; }
.progress { height: .75rem; border-radius: 999px; background: rgb(255 255 255 / .22); overflow: hidden; }
.progress > div { height: 100%; border-radius: 999px; transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.warn-text { margin: .5rem 0 0; font-size: .875rem; font-weight: 500; color: hsl(var(--secondary)); }
.pulse { animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
@keyframes pulse { 50% { opacity: .5; } }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.tile { padding: .8rem .35rem; text-align: center; border-radius: 1rem; }
.tile small { display: block; font-size: .7rem; color: hsl(var(--muted-foreground)); margin-bottom: .1rem; }
.tile b { display: block; font-size: 1rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.tile i { display: block; font-style: normal; font-size: .65rem; color: hsl(var(--muted-foreground)); }
.tile.bad b { color: hsl(var(--destructive)); }

.top-cat { display: flex; align-items: center; gap: 1rem; padding: 1rem; }
.top-cat .em { font-size: 2.25rem; line-height: 1; }
.top-cat .grow { flex: 1; min-width: 0; }
.top-cat .sub { margin: 0; font-size: .875rem; color: hsl(var(--muted-foreground)); }
.top-cat .name { margin: 0; font-weight: 600; }
.top-cat .amt { text-align: end; }
.top-cat .amt b { display: block; font-size: 1.125rem; }
.top-cat .amt span { font-size: .75rem; color: hsl(var(--muted-foreground)); }

.lim { display: flex; flex-direction: column; gap: .9rem; }
.lim-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .3rem .65rem; }
.lim-row .badge { grid-row: span 2; font-size: 1.1rem; padding: .4rem; border-radius: .65rem; }
.lim-row .nm { font-size: .875rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lim-row .v { font-size: .75rem; color: hsl(var(--muted-foreground)); white-space: nowrap; }
.lim-row .v.over { color: hsl(var(--destructive)); font-weight: 600; }
.lim-bar { grid-column: 2 / -1; height: .5rem; border-radius: 99px; background: hsl(var(--muted)); overflow: hidden; }
.lim-bar > div { height: 100%; border-radius: 99px; min-width: 3px; }

/* ---------- expense list ---------- */
.list { display: flex; flex-direction: column; gap: .5rem; }
.exp {
  width: 100%; display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem;
  background: hsl(var(--card) / calc(var(--glass) + .12)); border: 1px solid hsl(var(--border) / .5);
  border-radius: 1rem; box-shadow: 0 1px 2px rgb(0 0 0 / .05);
  text-align: start; transition: transform .2s, box-shadow .2s;
}
.exp:active { transform: scale(.98); }
@media (hover: hover) { .exp:hover { transform: scale(1.015); box-shadow: 0 4px 6px -1px rgb(0 0 0 / .1); } }
.badge { border-radius: .75rem; padding: .5rem; font-size: 1.5rem; line-height: 1; display: inline-flex; }
.badge.sm { font-size: 1.1rem; padding: .4rem; border-radius: .65rem; }
.exp .grow { flex: 1; min-width: 0; }
.exp .amount { margin: 0; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
.exp .sub { margin: 0; font-size: .8rem; color: hsl(var(--muted-foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.exp .date { font-size: .8rem; color: hsl(var(--muted-foreground)); white-space: nowrap; }
.rec-tag { font-size: .65rem; font-weight: 600; padding: .05rem .4rem; border-radius: 99px; background: hsl(var(--accent) / .18); color: hsl(var(--foreground)); display: inline-flex; align-items: center; gap: .2rem; }
.rec-tag svg { width: .7rem; height: .7rem; }
.day { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; color: hsl(var(--muted-foreground)); font-weight: 600; margin: .9rem .25rem .4rem; }
.day:first-child { margin-top: .25rem; }
.day b { color: hsl(var(--foreground)); }
.sumline { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; color: hsl(var(--muted-foreground)); padding: 0 .25rem; }
.sumline b { color: hsl(var(--foreground)); font-weight: 700; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 0; text-align: center; color: hsl(var(--muted-foreground)); }
.empty .em { font-size: 3rem; margin-bottom: 1rem; }
.empty.big .em { font-size: 3.75rem; }
.empty p { margin: 0; }
.empty p + p { font-size: .875rem; margin-top: .25rem; }
.empty .btn { margin-top: 1.1rem; }

/* month navigation, search, chips */
.mnav { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.mnav .mb { width: 2.6rem; height: 2.6rem; border-radius: .8rem; display: flex; align-items: center; justify-content: center; border: 1px solid hsl(var(--border)); background: hsl(var(--card) / var(--glass)); transition: transform .15s, opacity .2s; }
.mnav .mb:active { transform: scale(.92); }
.mnav .mb:disabled { opacity: .35; pointer-events: none; }
.mnav .ml { flex: 1; text-align: center; font-weight: 700; font-size: 1.05rem; padding: .35rem; border-radius: .75rem; }
.search { position: relative; }
.search svg { position: absolute; top: 50%; inset-inline-start: .9rem; transform: translateY(-50%); color: hsl(var(--muted-foreground)); pointer-events: none; }
.search .input { padding-inline-start: 2.7rem; background: hsl(var(--card) / var(--glass)); }
.chips { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; padding: .2rem .2rem .3rem; margin: 0 -.2rem; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: .35rem; height: 2.25rem; padding: 0 .9rem; border-radius: 99px;
  border: 1px solid hsl(var(--border)); background: hsl(var(--card) / var(--glass)); font-size: .85rem; font-weight: 500; white-space: nowrap;
  transition: background .2s, color .2s, transform .15s;
}
.chip:active { transform: scale(.94); }
.chip.sm { height: 2rem; padding: 0 .75rem; font-size: .8rem; }
.chip.on { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; }
.delta { font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; gap: .25rem; }
.delta.up { color: hsl(var(--destructive)); }
.delta.down { color: hsl(var(--accent)); }
.delta svg { width: 1rem; height: 1rem; }
.sum-card { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.sum-card small { display: block; font-size: .8rem; color: hsl(var(--muted-foreground)); }
.sum-card b { font-size: 1.5rem; font-weight: 700; }
.sum-card .end { text-align: end; }

/* ---------- FAB + bottom nav ---------- */
.fab {
  position: fixed; z-index: 40; right: max(1rem, calc((100vw - 32rem) / 2 + 1rem)); bottom: calc(6rem + env(safe-area-inset-bottom, 0px));
  width: 3.5rem; height: 3.5rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: hsl(var(--primary-foreground));
  background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary) / .8));
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / .25); transition: transform .3s cubic-bezier(.3, 1.2, .5, 1);
}
html.fx .fab { box-shadow: 0 12px 22px -6px hsl(var(--primary) / .7); }
.fab:active { transform: scale(.92); }
body.has-toast .fab { transform: translateY(-3.6rem); }
.fab svg { width: 1.75rem; height: 1.75rem; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  background: hsl(var(--card) / .97); border-top: 1px solid hsl(var(--border));
  padding: 0 .5rem max(env(safe-area-inset-bottom, 0px), .5rem);
}
html.fx .nav { background: hsl(var(--card) / .8); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); }
.nav-inner { display: flex; justify-content: space-around; align-items: center; height: 4rem; max-width: 32rem; margin: 0 auto; gap: .25rem; }
.nav a {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: .45rem .25rem; border-radius: .75rem;
  color: hsl(var(--muted-foreground)); transition: background .2s, color .2s;
}
.nav a svg { width: 1.5rem; height: 1.5rem; }
.nav a span { font-size: .72rem; font-weight: 500; margin-top: .2rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a.active { color: hsl(var(--primary)); background: hsl(var(--primary) / .1); }
.nav a.active svg { transform: scale(1.1); }
.nav a:active { transform: scale(.95); }

/* ---------- buttons / inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  height: 2.5rem; padding: 0 1rem; border-radius: calc(var(--radius) - 2px);
  font-size: .875rem; font-weight: 500; white-space: nowrap; transition: background .2s, opacity .2s, transform .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.btn-outline { border: 1px solid hsl(var(--border)); background: hsl(var(--background) / .7); }
.btn-danger { background: hsl(var(--destructive)); color: #fff; }
.btn-danger-o { border: 1px solid hsl(var(--destructive) / .55); color: hsl(var(--destructive)); background: transparent; }
.btn-lg { height: 3rem; font-size: 1rem; }
.btn-sm { height: 2rem; padding: 0 .75rem; font-size: .8rem; }
.btn-block { width: 100%; }
.btn-icon { width: 2.75rem; padding: 0; flex-shrink: 0; height: 3rem; }
.btn-grow { flex: 1; }
.icon-btn { width: 2.25rem; height: 2.25rem; border-radius: .65rem; display: inline-flex; align-items: center; justify-content: center; color: hsl(var(--muted-foreground)); flex-shrink: 0; }
.icon-btn:hover { background: hsl(var(--muted)); }
@media (hover: hover) {
  .btn-primary:hover { background: hsl(var(--primary) / .9); }
  .btn-outline:hover { background: hsl(var(--muted)); }
  .btn-danger:hover { opacity: .9; }
}
.field { display: flex; flex-direction: column; gap: .5rem; }
.field > label, .label { font-size: 1rem; font-weight: 500; }
.input, .textarea, .select {
  width: 100%; border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 2px);
  background: hsl(var(--background)); padding: .5rem .75rem; font-size: 1rem; outline: none;
}
.input, .select { height: 2.75rem; }
.input.amount { height: 3.5rem; font-size: 1.5rem; font-weight: 700; text-align: center; }
.input.err { border-color: hsl(var(--destructive)); }
.input:focus, .textarea:focus, .select:focus { box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--primary)); }
.textarea { resize: none; min-height: 5rem; }
.textarea.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .75rem; direction: ltr; text-align: left; min-height: 6rem; }
.field-err { margin: 0; font-size: .875rem; color: hsl(var(--destructive)); }
.hint { margin: 0; font-size: .85rem; color: hsl(var(--muted-foreground)); }
.form { display: flex; flex-direction: column; gap: 1.25rem; }
.form-actions { display: flex; gap: .75rem; padding-top: .5rem; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.sub-title { margin: 1.4rem 0 .6rem; font-size: .95rem; font-weight: 700; }
.sub-title:first-child { margin-top: 0; }

.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.cat {
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0;
  padding: .75rem .25rem; border-radius: 1rem; background: hsl(var(--muted) / .5);
  transition: transform .2s, background .2s;
}
.cat .em { font-size: 1.5rem; margin-bottom: .25rem; line-height: 1.2; }
.cat .nm {
  font-size: .75rem; font-weight: 500; line-height: 1.25; text-align: center; max-width: 100%; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: break-word;
}
html[dir="ltr"] .cat .nm { font-size: .65rem; }
.cat.sel { color: #fff; transform: scale(1.05); box-shadow: 0 0 0 2px hsl(var(--primary)), 0 10px 15px -3px rgb(0 0 0 / .2); }
.cat:active { transform: scale(.95); }

/* ---------- settings ---------- */
.seg { display: flex; gap: .5rem; }
.seg button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: .25rem;
  padding: .75rem .5rem; border-radius: calc(var(--radius) - 2px); font-size: .875rem; font-weight: 500;
  border: 1px solid hsl(var(--border)); background: hsl(var(--background) / .7); transition: background .2s, color .2s;
}
.seg.row button { flex-direction: row; justify-content: center; height: 2.5rem; padding: 0 1rem; }
.seg.lang { direction: ltr; } /* English on the left, العربية on the right, in both languages */
.seg button.on { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: hsl(var(--primary)); }
.seg button span { font-size: .75rem; }
.seg.row button span { font-size: .875rem; }
.seg svg { width: 1.25rem; height: 1.25rem; }
.card.rows { padding: .25rem 1.25rem; }
.rowi { display: flex; align-items: center; gap: .85rem; width: 100%; padding: .9rem 0; text-align: start; border-top: 1px solid hsl(var(--border) / .6); }
.rowi:first-child { border-top: 0; }
.rowi .ri-ic { width: 2.4rem; height: 2.4rem; border-radius: .8rem; display: flex; align-items: center; justify-content: center; background: hsl(var(--primary) / .12); font-size: 1.2rem; flex-shrink: 0; }
.rowi .ri-tx { flex: 1; min-width: 0; }
.rowi b { display: block; font-weight: 600; font-size: .95rem; }
.rowi small { display: block; color: hsl(var(--muted-foreground)); font-size: .8rem; }
.rowi > svg { color: hsl(var(--muted-foreground)); width: 1.1rem; height: 1.1rem; }
.rowi:active .ri-ic { transform: scale(.9); }
.swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .85rem .5rem; margin-bottom: 1rem; }
.sw-item { display: flex; flex-direction: column; align-items: center; gap: .3rem; min-width: 0; }
.sw-item small { font-size: .7rem; color: hsl(var(--muted-foreground)); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw {
  position: relative; display: grid; place-items: center; width: 3.1rem; height: 3.1rem; border-radius: 50%;
  background: linear-gradient(135deg, var(--p) 0 55%, var(--a) 55% 100%);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .1); transition: transform .2s, box-shadow .2s;
}
.sw-item:active .sw { transform: scale(.9); }
.sw.custom { background: conic-gradient(#f43f5e, #f59e0b, #84cc16, #06b6d4, #6366f1, #d946ef, #f43f5e); }

.sw.on::after { content: ''; width: .95rem; height: .5rem; border: solid #fff; border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); filter: drop-shadow(0 1px 1px rgb(0 0 0 / .5)); }
.pickers { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .75rem; }
.cpick { display: flex; align-items: center; gap: .5rem; padding: .45rem .5rem .45rem .75rem; border: 1px solid hsl(var(--border)); border-radius: .9rem; background: hsl(var(--background) / .6); min-width: 0; }

.cpick span { font-size: .85rem; font-weight: 500; flex: 1; min-width: 0; }
.cpick input { inline-size: 2.5rem; block-size: 2.5rem; border: 0; padding: 0; background: none; border-radius: .7rem; overflow: hidden; cursor: pointer; flex-shrink: 0; }
.cpick input::-webkit-color-swatch-wrapper { padding: 0; }
.cpick input::-webkit-color-swatch { border: 0; border-radius: .7rem; }
.cpick input::-moz-color-swatch { border: 0; border-radius: .7rem; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid hsl(var(--border) / .6); }
.switch-row b { display: block; font-size: .95rem; font-weight: 600; }
.switch-row small { display: block; font-size: .8rem; color: hsl(var(--muted-foreground)); }
.switch { position: relative; width: 3rem; height: 1.75rem; border-radius: 99px; background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); transition: background .25s; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 2px; inset-inline-start: 2px; width: calc(1.75rem - 6px); height: calc(1.75rem - 6px); border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .35); transition: transform .28s cubic-bezier(.3, 1.4, .5, 1); }
.switch[aria-checked="true"] { background: hsl(var(--primary)); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(1.25rem); }
html[dir="rtl"] .switch[aria-checked="true"]::after { transform: translateX(-1.25rem); }
.about { text-align: center; background: linear-gradient(135deg, hsl(var(--primary) / .06), hsl(var(--accent) / .06)); padding-top: 1.5rem; }
.about .em { font-size: 3rem; display: block; margin-bottom: .75rem; }
.about h2 { margin: 0 0 .25rem; font-size: 1.25rem; }
.about p { margin: 0; font-size: .875rem; color: hsl(var(--muted-foreground)); }

/* sheet sub-forms */
.lim-field { display: grid; grid-template-columns: auto minmax(0, 1fr) 7.5rem; align-items: center; gap: .6rem; }
.lim-field label { font-size: .9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lim-field .input { height: 2.5rem; text-align: center; }
.crow { display: flex; align-items: center; gap: .65rem; padding: .6rem .7rem; border-radius: 1rem; background: hsl(var(--card) / .7); border: 1px solid hsl(var(--border) / .6); }
.crow .grow { flex: 1; min-width: 0; text-align: start; }
.crow b { display: block; font-size: .95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow small { display: block; font-size: .78rem; color: hsl(var(--muted-foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow.off { opacity: .6; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: .35rem; }
.emo { aspect-ratio: 1; border-radius: .65rem; background: hsl(var(--muted) / .5); font-size: 1.15rem; line-height: 1; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
.emo:active { transform: scale(.9); }
.emo.on { box-shadow: 0 0 0 2px hsl(var(--primary)); background: hsl(var(--primary) / .12); }
.color-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; justify-items: center; }
.clr { width: 2.4rem; height: 2.4rem; border-radius: 50%; transition: transform .15s; }
.clr:active { transform: scale(.9); }
.clr.on { box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--foreground)); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; font-size: 0; }
.preview-cat { display: flex; align-items: center; gap: .6rem; }

/* ---------- charts ---------- */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { font-family: inherit; fill: hsl(var(--muted-foreground)); }
.donut { max-width: 260px; margin: 0 auto; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: 1rem; }
.legend div { display: flex; align-items: center; gap: .5rem; min-width: 0; }
.legend .em { font-size: 1.125rem; }
.legend .nm { font-size: .875rem; color: hsl(var(--muted-foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .v { font-size: .875rem; font-weight: 500; margin-inline-start: auto; }
.bars { display: flex; flex-direction: column; gap: .75rem; }
.bar-row { display: grid; grid-template-columns: 6.5rem 1fr auto; align-items: center; gap: .5rem; }
.bar-row .nm { font-size: .8rem; color: hsl(var(--muted-foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 1.1rem; background: hsl(var(--muted)); border-radius: 999px; overflow: hidden; }
.bar-track > div { height: 100%; border-radius: 999px; min-width: 4px; }
.bar-row .v { font-size: .8rem; font-weight: 600; }

/* ---------- sheet + dialogs + toast ---------- */
.layer { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
.layer.dlg { z-index: 60; }
.layer.show { visibility: visible; }
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .55); opacity: 0; transition: opacity .25s ease; }
html.fx .scrim { -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.layer.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 32rem;
  height: 85vh; height: 85dvh; background: hsl(var(--background));
  border-radius: 1.5rem 1.5rem 0 0; border-top: 1px solid hsl(var(--border));
  padding: 0 1.5rem; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .38s cubic-bezier(.2, .85, .25, 1); box-shadow: 0 -10px 30px rgb(0 0 0 / .25);
}
.layer.open .sheet { transform: none; }
.sheet-head { margin: 0 -1.5rem; padding: .6rem 1.5rem .25rem; touch-action: none; cursor: grab; flex-shrink: 0; }
.grab { display: block; width: 2.6rem; height: .3rem; border-radius: 99px; background: hsl(var(--muted-foreground) / .45); margin: 0 auto .85rem; }
.sheet h2 { margin: 0 0 .75rem; font-size: 1.125rem; font-weight: 600; padding-inline-end: 2rem; }
.sheet-body { overflow-y: auto; flex: 1; margin: 0 -.5rem; padding: .25rem .5rem 2.5rem; scrollbar-width: none; overscroll-behavior: contain; } /* side/top room so the selected category's ring isn't clipped */
.sheet-body::-webkit-scrollbar { display: none; }
.close-x {
  position: absolute; top: 1.35rem; inset-inline-end: 1.25rem; width: 2rem; height: 2rem; border-radius: .5rem;
  display: flex; align-items: center; justify-content: center; opacity: .7;
}
.close-x:hover { opacity: 1; }
.dialog-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.dialog {
  width: 100%; max-width: 26rem; background: hsl(var(--background)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
  opacity: 0; transform: scale(.94) translateY(8px); transition: opacity .2s, transform .3s cubic-bezier(.3, 1.3, .5, 1); position: relative;
  box-shadow: 0 20px 40px rgb(0 0 0 / .3);
}
.layer.open .dialog { opacity: 1; transform: none; }
.dialog h2 { margin: 0; font-size: 1.125rem; font-weight: 600; }
.dialog p { margin: 0; font-size: .875rem; color: hsl(var(--muted-foreground)); }
.dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
.dialog .actions .btn { min-width: 5.5rem; }
.dialog .actions.col { flex-direction: column; }
.dialog .actions.col .btn { width: 100%; height: 2.9rem; }

#toast-root { position: fixed; left: 0; right: 0; bottom: calc(4.9rem + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; justify-content: center; padding: 0 1rem; pointer-events: none; }
.toast {
  position: relative; overflow: hidden; pointer-events: auto; display: flex; align-items: center; gap: .75rem; width: 100%; max-width: 30rem;
  background: hsl(var(--foreground)); color: hsl(var(--background)); padding: .75rem 1rem; border-radius: 1rem; font-size: .9rem; line-height: 1.4;

}
.toast.show { transform: none; opacity: 1; }
.toast.warn { background: hsl(var(--secondary)); color: hsl(220 25% 12%); }
.toast.bad { background: hsl(var(--destructive)); color: #fff; }
.toast .msg { flex: 1; min-width: 0; }
.toast .tbtn { flex-shrink: 0; height: 2rem; padding: 0 .85rem; border-radius: .65rem; font-weight: 700; font-size: .85rem; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.toast .tbar { position: absolute; inset-inline-start: 0; bottom: 0; height: 3px; width: 100%; background: currentColor; opacity: .35; animation: tbar linear forwards; }

/* ---------- misc ---------- */
.notfound { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: hsl(var(--muted)); padding: 1rem; }
.notfound h1 { font-size: 2.25rem; margin: 0 0 1rem; }
.notfound p { font-size: 1.25rem; color: hsl(var(--muted-foreground)); margin: 0 0 1rem; }
.notfound a { color: hsl(var(--primary)); text-decoration: underline; }
.fatal { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: 1.5rem; text-align: center; }
.fatal .em { font-size: 3rem; }
.fatal h1 { margin: 0; font-size: 1.25rem; }
.fatal p { margin: 0; color: hsl(var(--muted-foreground)); max-width: 22rem; word-break: break-word; }
body.locked { overflow: hidden; }

/* ---------- motion (only when effects are on) ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.985); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.92); } 60% { transform: scale(1.025); } 100% { opacity: 1; transform: none; } }
@keyframes flash { 0% { box-shadow: 0 0 0 2px hsl(var(--primary)), 0 6px 16px hsl(var(--primary) / .35); } 100% { box-shadow: 0 0 0 2px hsl(var(--primary) / 0), 0 1px 2px rgb(0 0 0 / .05); } }
@keyframes grow { from { width: 0; } }
@keyframes sector { from { opacity: 0; transform: scale(.82); } }
@keyframes draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } }
@keyframes tbar { from { width: 100%; } to { width: 0; } }
@keyframes fabin { from { transform: scale(0) rotate(-120deg); } }
@keyframes iconpop { 0% { transform: scale(.7); } 60% { transform: scale(1.28); } 100% { transform: scale(1.1); } }
html.fx .enter main > * { animation: rise .55s cubic-bezier(.2, .8, .2, 1) backwards; }
html.fx .enter main > :nth-child(2) { animation-delay: .06s; }
html.fx .enter main > :nth-child(3) { animation-delay: .12s; }
html.fx .enter main > :nth-child(4) { animation-delay: .18s; }
html.fx .enter main > :nth-child(5) { animation-delay: .24s; }
html.fx .enter main > :nth-child(6) { animation-delay: .30s; }
html.fx .enter main > :nth-child(n+7) { animation-delay: .36s; }
html.fx .enter .list > .exp { animation: rise .45s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(.22s + var(--i, 0) * .04s); }
html.fx .enter .progress > div { animation: grow .9s cubic-bezier(.2, .8, .2, 1) .2s backwards; }
html.fx .enter .bar-track > div, html.fx .enter .lim-bar > div { animation: grow .8s cubic-bezier(.2, .8, .2, 1) .3s backwards; }
html.fx .enter .donut path, html.fx .enter .donut .ring { transform-origin: 50% 50%; animation: sector .7s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(.15s + var(--i, 0) * .08s); }
html.fx .enter .trend-line { animation: draw 1.1s ease .2s backwards; }
html.fx .enter .trend-dot { animation: fadein .4s ease 1s backwards; }
html.fx .exp.flash { animation: pop .5s cubic-bezier(.2, .8, .2, 1) both, flash 1.6s ease-out .1s both; }
html.fx .fab { animation: fabin .5s cubic-bezier(.3, 1.4, .5, 1) backwards; }
html.fx .nav a.active svg { animation: iconpop .45s cubic-bezier(.3, 1.5, .5, 1) both; }
html:not(.fx) *, html:not(.fx) *::before, html:not(.fx) *::after { transition: none !important; animation: none !important; }
html.fx.theming *, html.fx.theming *::before, html.fx.theming *::after { transition: background-color .35s, color .35s, border-color .35s, fill .35s, stroke .35s !important; }

      if (meta) meta.setAttribute('content', '#8B5CF6');

    var e = effectiveColors();

            labels += '<text x="' + p[0] + '" y="' + (parseFloat(p[1]) + 4.5) + '" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">' + fmt(Math.round(frac * 100)) + '%</text>';

  function monotonePath(pts) {
    var n = pts.length;
    if (n < 2) return '';
    var dx = [], m = [], tg = [], i;
    for (i = 0; i < n - 1; i++) { dx.push(pts[i + 1].x - pts[i].x); m.push((pts[i + 1].y - pts[i].y) / dx[i]); }
    tg[0] = m[0]; tg[n - 1] = m[n - 2];
    for (i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (i = 0; i < n - 1; i++) {
      if (m[i] === 0) { tg[i] = 0; tg[i + 1] = 0; continue; }
      var a = tg[i] / m[i], b = tg[i + 1] / m[i], s = a * a + b * b;
      if (s > 9) { var k = 3 / Math.sqrt(s); tg[i] = k * a * m[i]; tg[i + 1] = k * b * m[i]; }
    }
    var d = 'M' + pts[0].x + ',' + pts[0].y;
    for (i = 0; i < n - 1; i++) {
      var h = dx[i] / 3;
      d += ' C' + (pts[i].x + h) + ',' + (pts[i].y + tg[i] * h) + ' ' + (pts[i + 1].x - h) + ',' + (pts[i + 1].y - tg[i + 1] * h) + ' ' + pts[i + 1].x + ',' + pts[i + 1].y;
    }
    return d;
  }
  function niceMax(v) {
    if (v <= 0) return 4;
    var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), n = v / p;
    var mult = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return Math.max(mult * p, 4);
  }

  function trendSvg(series) {
    var W = 320, H = 200, L = 52, R = 14, Tp = 24, B = 30;
    var max = niceMax(Math.max.apply(null, series.map(function (s) { return s.total; })));
    var innerW = W - L - R, innerH = H - Tp - B, i;
    var grid = '';
    for (i = 0; i <= 4; i++) {
      var yy = Tp + innerH - (innerH * i / 4);
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke-dasharray="3 3" style="stroke:hsl(var(--border))"/>' +
        '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" style="font-size:10px">' + fmt(max * i / 4) + '</text>';
    }
    var pts = series.map(function (s, idx) {
      return { x: L + (innerW * idx / (series.length - 1)), y: Tp + innerH - (s.total / max) * innerH, v: s.total, name: s.name };
    });
    var xl = '', dots = '', vals = '';
    pts.forEach(function (p) {
      xl += '<text x="' + p.x + '" y="' + (H - 8) + '" text-anchor="middle" style="font-size:11px">' + esc(p.name) + '</text>';
      dots += '<circle class="trend-dot" cx="' + p.x + '" cy="' + p.y + '" r="4" style="fill:hsl(var(--primary));stroke:hsl(var(--card))" stroke-width="2"><title>' + esc(p.name) + ': ' + fmt(p.v) + ' ' + t('egp') + '</title></circle>';
      if (p.v > 0) vals += '<text class="trend-dot" x="' + p.x + '" y="' + (p.y - 10) + '" text-anchor="middle" style="font-size:9.5px;fill:hsl(var(--foreground));font-weight:600">' + fmt(p.v) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="direction:ltr" role="img" aria-label="' + esc(t('monthlyTrend')) + '">' + grid + xl +
      '<path class="trend-line" pathLength="1" d="' + monotonePath(pts) + '" fill="none" stroke-width="3" stroke-linecap="round" style="stroke:hsl(var(--primary))"/>' + dots + vals + '</svg>';
  }

  /* ---------- render + post-render motion ---------- */
  function countUp(el, from, to, dur) {
    var t0 = null, done = false;
    function finish() { if (!done) { done = true; el.textContent = fmt(to); } }
    function step(ts) {
      if (done || !el.isConnected) return;
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(Math.round(from + (to - from) * e));
      if (p < 1) requestAnimationFrame(step); else finish();
    }
    el.textContent = fmt(Math.round(from));
    requestAnimationFrame(step);
    setTimeout(finish, dur + 200);
  }

  function afterRender(enter) {
    if (enter) lastShown = {};
    Array.prototype.forEach.call($page.querySelectorAll('[data-count]'), function (el) {
      var key = el.getAttribute('data-key'), to = parseFloat(el.getAttribute('data-count'));
      var from = lastShown.hasOwnProperty(key) ? lastShown[key] : 0;
      lastShown[key] = to;
      if (FX() && from !== to) countUp(el, from, to, enter ? 900 : 650);
    });
    Array.prototype.forEach.call($page.querySelectorAll('[data-w]'), function (el) {
      var target = parseFloat(el.getAttribute('data-w'));
      if (parseFloat(el.style.width) !== target) {
        requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.width = target + '%'; }); });
      }
    });
  }

    else if (route === '/settings') html = settingsHtml();
    else html = notFoundHtml();
    $page.className = enter && FX() ? 'enter' : '';
    $page.innerHTML = html;
    afterRender(!!enter);
    S.ui.flash = null;
  }

  var $sheet = document.getElementById('sheet-root');

  function updateLock() {
    var open = $sheet.classList.contains('show') || $dialog.classList.contains('show');
    document.body.classList.toggle('locked', open);
  }
  function openLayer(root, key, html) {
    clearTimeout(timers[key]);
    var wasOpen = root.classList.contains('open');
    root.innerHTML = html;
    root.classList.add('show');
    root.offsetWidth; // force reflow so the open transition runs
    root.classList.add('open');
    if (!wasOpen) entry[key] = histPush();
    updateLock();
  }
  function closeLayer(root, key, fromPop) {
    if (!root.classList.contains('open')) return;
    root.classList.remove('open');
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () { root.classList.remove('show'); root.innerHTML = ''; updateLock(); }, FX() ? 380 : 0);
    if (entry[key]) {
      entry[key] = false; hist.depth--;
      if (!fromPop) { hist.pending++; histFlush(); }
    }
    updateLock();
  }
  function closeSheet(fromPop) { closeLayer($sheet, 'sheet', fromPop); sheetState = null; }
  function closeDialog(fromPop) { closeLayer($dialog, 'dialog', fromPop); }

  function status(spent, limit) { return limit > 0 ? (spent > limit ? 2 : (spent / limit >= 0.8 ? 1 : 0)) : 0; }
  function budgetAlert(prev, next, saved) {
    var d = new Date(saved.date), now = new Date();
    if (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth()) return null;
    var y = now.getFullYear(), m = now.getMonth(), cands = [], b, a, sb, sa;
    var lim = S.budget.categoryLimits[saved.categoryId];
    if (lim > 0) {
      var same = function (e) { return e.categoryId === saved.categoryId; };
      b = sum(inMonth(prev, y, m).filter(same)); a = sum(inMonth(next, y, m).filter(same));
      sb = status(b, lim); sa = status(a, lim);
      if (sa > sb) {
        var c = getCategory(saved.categoryId);
        cands.push({ lvl: sa, text: sa === 2 ? tpl('alertCatOver', { name: catName(c), spent: fmt(a), limit: fmt(lim) }) : tpl('alertCatWarn', { name: catName(c), pct: fmt(Math.round(a / lim * 100)) }) });
      }
    }
    var bud = S.budget.monthly;
    b = sum(inMonth(prev, y, m)); a = sum(inMonth(next, y, m));
    sb = status(b, bud); sa = status(a, bud);
    if (sa > sb) cands.push({ lvl: sa, text: sa === 2 ? t('alertBudgetOver') : tpl('alertBudgetWarn', { pct: fmt(Math.round(a / bud * 100)) }) });
    cands.sort(function (p, q) { return q.lvl - p.lvl; });
    return cands[0] || null;
  }

    var notes = document.getElementById('f-notes').value.trim();
    var editing = sheetState.editing, iso;
    if (editing && dateStr === toInputDate(new Date(editing.date))) iso = editing.date;            // untouched date: keep as is
    else if (dateStr === toInputDate(new Date())) iso = new Date().toISOString();                    // today: keep time for ordering
    else { var p = dateStr.split('-'); iso = new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0).toISOString(); }

    var prev = S.expenses, saved;

      document.body.appendChild(ta); ta.select();

    try {

      case 'lang': S.lang = v === 'en' ? 'en' : 'ar'; setItem(KEYS.lang, S.lang); applyLang(); renderChrome(); renderPage(false); break;
      case 'theme':
        themeTransition(); S.theme = v; if (v === 'system') removeItem(KEYS.theme); else setItem(KEYS.theme, v); applyTheme();
        Array.prototype.forEach.call(document.querySelectorAll('[data-action="theme"]'), function (b) { b.classList.toggle('on', b === el); });
        break;
      case 'preset':
        themeTransition();
        if (v === 'custom') { var e0 = effectiveColors(); S.colors = { preset: 'custom', primary: hslToHex(e0.p[0], e0.p[1], e0.p[2]), accent: hslToHex(e0.a[0], e0.a[1], e0.a[2]) }; }
        else S.colors = { preset: findPreset(v) ? v : 'violet' };
        saveColors(); applyColors(); syncColorUI(true); buzz(6);
        break;
      case 'reset-colors': themeTransition(); S.colors = { preset: 'violet' }; saveColors(); applyColors(); syncColorUI(true); break;
      case 'fx':
        S.fx = !S.fx; setItem(KEYS.fx, S.fx ? 'on' : 'off'); applyFx();
        el.setAttribute('aria-checked', S.fx ? 'true' : 'false');
        break;

      case 'budget': openBudgetDialog(); break;
      case 'open-limits': openLimitsSheet(); break;
      case 'open-cats': openCatsSheet(); break;
      case 'open-recurring': openRecurringSheet(); break;
      case 'open-backup': openBackupSheet(); break;

      case 'month-prev': shiftView(-1); S.ui.cat = 'all'; renderPage(false); break;
      case 'month-next': shiftView(1); S.ui.cat = 'all'; renderPage(false); break;
      case 'month-now': resetView(); S.ui.cat = 'all'; renderPage(false); break;
      case 'chip':
        S.ui.cat = v;
        Array.prototype.forEach.call(document.querySelectorAll('#exp-chips .chip'), function (b) { b.classList.toggle('on', b === el); });
        refreshResults();
        break;

      case 'pick-emoji':
        if (!sheetState || sheetState.type !== 'cats') break;
        sheetState.icon = el.getAttribute('data-e');
        var $ic = document.getElementById('cat-icon'); if ($ic) $ic.value = sheetState.icon;
        Array.prototype.forEach.call($sheet.querySelectorAll('.emo'), function (b) { b.classList.toggle('on', b === el); });
        break;
      case 'pick-color':
        if (!sheetState || sheetState.type !== 'cats') break;
        sheetState.color = el.getAttribute('data-c');
        Array.prototype.forEach.call($sheet.querySelectorAll('.clr'), function (b) { b.classList.toggle('on', b === el); });
        break;
      case 'edit-cat':
        if (!sheetState || sheetState.type !== 'cats') break;
        var cc = null; S.cats.forEach(function (c) { if (c.id === id) cc = c; });
        if (cc) { sheetState.editId = cc.id; sheetState.name = cc.name; sheetState.icon = cc.icon; sheetState.color = cc.color; refreshSheetBody(); var sb = document.getElementById('sheet-body'); if (sb) sb.scrollTop = 0; }
        break;
      case 'cancel-cat-edit': sheetState.editId = null; sheetState.name = ''; sheetState.icon = EMOJIS[0]; sheetState.color = CAT_COLORS[0]; refreshSheetBody(); break;
      case 'ask-del-cat':
        askConfirm({ title: t('deleteCategory'), text: t('confirmDeleteCategory'), ok: t('delete'), danger: true, cb: function () { deleteCat(id); } });
        break;
      case 'toggle-rec':
        S.recurring.forEach(function (r) {
          if (r.id !== id) return;
          r.active = !r.active;
          if (r.active) r.start = startKeyFor(r.day);
        });
        saveRecurring();
        var gen = generateRecurring();
        refreshSheetBody(); renderPage(false);
        if (gen > 0) toast(tpl('recurringAdded', { n: fmt(gen) }));
        break;
      case 'ask-del-rec':
        askConfirm({
          title: t('deleteRecurring'), text: t('confirmDeleteRecurring'), ok: t('delete'), danger: true,
          cb: function () { S.recurring = S.recurring.filter(function (r) { return r.id !== id; }); saveRecurring(); refreshSheetBody(); renderPage(false); }
        });
        break;

      case 'export-backup':
        download('bayti-backup-' + toInputDate(new Date()) + '.json', JSON.stringify(backupObject(), null, 2), 'application/json');
        toast(t('downloaded'));
        break;
      case 'copy-backup': copyText(JSON.stringify(backupObject()), function (ok) { toast(ok ? t('copied') : t('importInvalid'), ok ? {} : { kind: 'bad' }); }); break;
      case 'export-csv': exportCsv(); break;
      case 'import-text': var $it = document.getElementById('import-text'); if ($it && $it.value.trim()) handleImportText($it.value); else toast(t('importInvalid'), { kind: 'bad' }); break;
      case 'import-merge': applyImport('merge'); break;
      case 'import-replace': applyImport('replace'); break;
      case 'ask-reset': askConfirm({ title: t('resetAll'), text: t('resetConfirm'), ok: t('erase'), danger: true, cb: eraseAll }); break;
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    switch (ev.target.id) {
      case 'expense-form': submitExpense(); break;
      case 'budget-form': submitBudget(); break;
      case 'limits-form': submitLimits(); break;
      case 'cat-form': submitCat(); break;
      case 'rec-form': submitRecurring(); break;
    }
  });

  document.addEventListener('input', function (ev) {
    var tg = ev.target, id = tg.id;
    if (id === 'exp-q') { S.ui.q = tg.value; refreshResults(); return; }
    if (id === 'c-primary' || id === 'c-accent') {
      S.colors = { preset: 'custom', primary: document.getElementById('c-primary').value, accent: document.getElementById('c-accent').value };
      saveColors(); applyColors(); syncColorUI(false);
      return;
    }
    if (id === 'f-date') { syncDateChips(); return; }
    if (id === 'cat-icon' && sheetState && sheetState.type === 'cats') {
      var g = firstGrapheme(tg.value); if (g) sheetState.icon = g;
      Array.prototype.forEach.call($sheet.querySelectorAll('.emo'), function (b) { b.classList.toggle('on', b.getAttribute('data-e') === sheetState.icon); });
      return;
    }
    if (tg.classList && tg.classList.contains('err')) {
      tg.classList.remove('err');
      var err = id ? document.getElementById(id + '-err') : null;
      if (err) err.hidden = true;
    }
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'import-file') return;
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { handleImportText(String(rd.result || '')); };
    rd.onerror = function () { toast(t('importInvalid'), { kind: 'bad' }); };
    rd.readAsText(f);
    ev.target.value = '';
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if ($dialog.classList.contains('open')) closeDialog();
    else if ($sheet.classList.contains('open')) closeSheet();
  });

  /* ---------- drag the sheet down to dismiss ---------- */
  var drag = null;
  document.addEventListener('pointerdown', function (ev) {
    if (ev.button > 0 || !ev.target.closest) return;
    var h = ev.target.closest('[data-drag]');
    if (!h || ev.target.closest('button')) return;
    var sheet = h.closest('.sheet');
    if (!sheet) return;
    drag = { sheet: sheet, y0: ev.clientY, t0: Date.now(), dy: 0, id: ev.pointerId };
    sheet.style.transition = 'none';
    try { h.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  });
  document.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    drag.dy = Math.max(0, ev.clientY - drag.y0);
    drag.sheet.style.transform = 'translateY(' + drag.dy + 'px)';
    var sc = $sheet.querySelector('.scrim');
    if (sc) sc.style.opacity = String(Math.max(0, 1 - drag.dy / (drag.sheet.offsetHeight || 600)));
  });
  function endDrag(ev) {
    if (!drag || (ev && ev.pointerId !== drag.id)) return;
    var d = drag; drag = null;
    var fast = d.dy / Math.max(1, Date.now() - d.t0) > 0.6;
    d.sheet.style.transition = '';
    var sc = $sheet.querySelector('.scrim'); if (sc) sc.style.opacity = '';
    d.sheet.style.transform = '';
    if (d.dy > 110 || (fast && d.dy > 40)) closeSheet();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  /* ---------- navigation ---------- */
  window.addEventListener('popstate', function () {
    if (hist.ignore > 0) { hist.ignore--; return; }
    if (entry.dialog && $dialog.classList.contains('open')) closeLayer($dialog, 'dialog', true);
    else if (entry.sheet && $sheet.classList.contains('open')) closeSheet(true);
  });
  window.addEventListener('hashchange', function () {
    closeLayer($dialog, 'dialog', true); closeSheet(true);
    entry.dialog = false; entry.sheet = false; hist.depth = 0; hist.pending = 0;
    S.ui.q = ''; S.ui.cat = 'all';
    hideToast();
    renderChrome(); renderPage(true);
    window.scrollTo(0, 0);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var n = generateRecurring();
    if (n > 0) { renderPage(false); toast(tpl('recurringAdded', { n: fmt(n) })); }
  });

  /* =====================================================================
     Boot
     ===================================================================== */
  function showFatal(message) {
    var ar = S.lang !== 'en';
    $page.innerHTML = '<div class="fatal"><div class="em">⚠️</div><h1>' + (ar ? T.ar.somethingWrong : T.en.somethingWrong) + '</h1><p>' + esc(message) +
      '</p><button class="btn btn-primary btn-lg" onclick="location.reload()">' + (ar ? T.ar.reload : T.en.reload) + '</button></div>';
  }

  var bootAdded = 0;
  try {
    applyFx();
    applyTheme();
    applyLang();
    bootAdded = generateRecurring();
    renderChrome();
    renderPage(true);
    if (bootAdded > 0) setTimeout(function () { toast(tpl('recurringAdded', { n: fmt(bootAdded) })); }, 500);
  } catch (e) {
    console.error(e);
    showFatal(e && e.message ? e.message : String(e));
  }
  window.addEventListener('error', function (ev) {
    if (!$page.childElementCount) showFatal(ev.message || 'Unknown error');
  });
})();
</script>
</body>
</html>
